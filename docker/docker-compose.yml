version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: knowsure_postgres
    environment:
      POSTGRES_DB: knowsure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: knowsure_postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowsure_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    container_name: knowsure_neo4j
    environment:
      NEO4J_AUTH: neo4j/knowsure_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: knowsure_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  n8n_data:
