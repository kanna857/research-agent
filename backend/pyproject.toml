[project]
name = "knowsure-backend"
version = "0.1.0"
description = "KnowSure Advanced Autonomous AI Research Intelligence Platform Backend"
authors = [{ name = "KnowSure Core Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.8.0",
    "neo4j>=5.18.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"

